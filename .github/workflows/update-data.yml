nô ame: Cập nhật Báo cáo Cận Date
on:
  schedule:
    - cron: '*/3 * * * *'
  workflow_dispatch: 
jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
    - name: Thiết lập Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Cài đặt thư viện
      run: |
        python -m pip install --upgrade pip
        pip install requests
    - name: Chạy Script lấy dữ liệu Cận Date
      run: python sabeco_shelflife_automation.py
    - name: Commit và Push data.js mới lên GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data.js
        git commit -m "Tự động cập nhật dữ liệu Cận Date" || echo "Không có thay đổi dữ liệu nào"
        git push
